<section class="contact-page">

  <h2 class="contact-title-mobile">Nous contacter</h2>

  <div class="contact-content">

    <img src="vache_lettre.png" alt="" aria-hidden="true" class="contact-illustration">

    <div class="contact-main">

      <div class="contact-card">

        <p class="contact-subtitle">
          Une question, une idée ou envie de rejoindre l’asso ?
          Écris-nous juste ici !
        </p>

        <form class="contact-form" (submit)="onSubmit($event)">

          <input type="hidden" name="_subject" value="Nouveau message depuis le site AAORTEi">

          <!-- champ piège anti-spam : invisible pour les humains -->
          <input class="piege" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

          <div class="form-row">

            <div class="champ">
              <label for="nom">Nom</label>

              <input
                id="nom"
                type="text"
                name="nom"
                placeholder="Vachette"
                required
                autocomplete="family-name"
                autocapitalize="words"
                enterkeyhint="next"
              >
            </div>

            <div class="champ">
              <label for="prenom">Prénom</label>

              <input
                id="prenom"
                type="text"
                name="prenom"
                placeholder="Légendaire"
                required
                autocomplete="given-name"
                autocapitalize="words"
                enterkeyhint="next"
              >
            </div>

          </div>

          <div class="champ">
            <label for="mail">Adresse mail</label>

            <input
              id="mail"
              type="email"
              name="email"
              placeholder="exemple@mail.com"
              required
              autocomplete="email"
              inputmode="email"
              autocapitalize="off"
              enterkeyhint="next"
            >
          </div>

          <div class="champ">
            <label for="message">Message</label>

            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Ton message..."
              required
              enterkeyhint="send"
            ></textarea>
          </div>

          <button type="submit" class="contact-button" [disabled]="status() === 'sending'">
            {{ status() === 'sending' ? 'Envoi...' : 'Envoyer' }}
          </button>

          @if (status() === 'success') {
            <p class="form-message form-message--ok">Merci, ton message est bien envoyé ! 🐮</p>
          }
          @if (status() === 'error') {
            <p class="form-message form-message--error">
              Oups, l'envoi a échoué. Réessaie ou écris-nous à aaorteicontact&#64;gmail.com
            </p>
          }

        </form>

      </div>

    </div>

  </div>

</section>
