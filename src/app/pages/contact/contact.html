<h2>Nous contacter</h2>

<form id="contact_mail" action="#" method="POST">
    <div class="champ">
        <label for="nom">Nom: </label>
        <input name="nom" value="" type="text" required>
    </div>
    <div class="champ">
        <label for="prenom">Prénom: </label>
        <input name="prenom" value="" type="text" required>
    </div>
    <div class="champ">
        <label for="mail">Adresse mail: </label>
        <input name="mail" value="" type="email" required>
    </div>
    <div class="champ">
        <label for="message">Message: </label>
        <textarea name="message"></textarea>
    </div>
    <div class="champ">
        <input name="envoyer" value="Envoyer" type="submit" required>
    </div>
</form>
